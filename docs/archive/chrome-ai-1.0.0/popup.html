<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      padding: 16px;
      background: #ffffff;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(145deg, #4F46E5 0%, #3730A3 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }
    .title { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 10px; color: #64748b; }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .shortcut {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 11px;
    }
    .shortcut-label { color: #475569; }
    .shortcut-keys { display: flex; gap: 3px; }
    kbd {
      background: #e2e8f0;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 9px;
      font-family: monospace;
      color: #334155;
    }
    .button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .button:active { transform: scale(0.98); }
    .button-primary {
      background: linear-gradient(145deg, #4F46E5 0%, #3730A3 100%);
      color: white;
    }
    .button-primary:hover { box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3); }
    .button-secondary {
      background: #f1f5f9;
      color: #475569;
      margin-top: 8px;
    }
    .button-secondary:hover { background: #e2e8f0; }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 9px;
      color: #94a3b8;
    }
    .footer strong { color: #4F46E5; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 10px;
      text-align: center;
      display: none;
    }
    .status.error { display: block; background: #fee2e2; color: #dc2626; }
    .status.info { display: block; background: #f0f9ff; color: #0369a1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AI</div>
    <div>
      <div class="title">AI Study Assistant</div>
      <div class="subtitle">Twój pomocnik w nauce</div>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">Skrót klawiszowy</div>
    <div class="shortcut">
      <span class="shortcut-label">Otwórz panel</span>
      <div class="shortcut-keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>A</kbd></div>
    </div>
  </div>
  
  <button class="button button-primary" id="openSidebar">🚀 Otwórz asystenta</button>
  <button class="button button-secondary" id="openSettings">⚙️ Ustawienia</button>
  
  <div class="status" id="status"></div>
  
  <div class="footer">
    v1.0.2 • Created by <strong>Oktawiusz Kapica</strong>
  </div>
  
  <script src="js/popup.js"></script>
</body>
</html>
